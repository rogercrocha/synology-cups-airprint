services:
  cups:
    build: .
    image: synology-cups-airprint:local
    container_name: cups-airprint
    # Host networking is required: CUPS must speak mDNS/DNS-SD on the LAN
    # so iPhones, iPads and Macs can discover the queue.
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      # Queues and server state persist across container rebuilds.
      - ./config:/etc/cups
    # Do NOT mount the host's /run/dbus: the container runs its own dbus and
    # avahi. They coexist with DSM's avahi, which keeps announcing the NAS.
